name: CI

permissions:
  contents: write
  id-token: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_publish_existing_version:
        description: "Force publish even when the version tag already exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Type Checks (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Show environment info
        run: |
          python --version
          pip list

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ci]

      - name: Bytecode compile smoke
        run: |
          python -m compileall -q src tests

      - name: Runtime import smoke
        run: |
          python -c "import novel_downloader; print(novel_downloader.__version__)"

      - name: Run tests
        run: |
          pytest -v

  os-compat:
    name: OS Compatibility (${{ matrix.os }} / Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ci]'

      - name: Bytecode compile smoke
        run: |
          python -m compileall -q src tests

      - name: Runtime import smoke
        run: |
          python -c "import novel_downloader; print(novel_downloader.__version__)"

      - name: Run tests
        run: |
          pytest -q

  package-smoke:
    name: Package Build Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install built wheel
        run: |
          pip install dist/*.whl

      - name: Entry-point smoke
        run: |
          novel-cli --version

  release-meta:
    name: Release Decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-matrix, package-smoke]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      should_release: ${{ steps.detect.outputs.should_release }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect release version and tag state
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("src/novel_downloader/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("Unable to parse __version__ from src/novel_downloader/__init__.py")
          print(m.group(1))
          PY
          )

          TAG="v${VERSION}"
          SHOULD_RELEASE="true"
          REASON="new-tag"

          FORCE_PUBLISH="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ github.event.inputs.force_publish_existing_version || 'false' }}" == "true" ]]; then
            FORCE_PUBLISH="true"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [[ "${FORCE_PUBLISH}" == "true" ]]; then
              echo "Tag ${TAG} already exists on origin, but force publish is enabled."
              REASON="forced-existing-tag"
            else
              echo "Tag ${TAG} already exists on origin. Publish will be skipped."
              SHOULD_RELEASE="false"
              REASON="existing-tag"
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"

  auto-post-bump:
    name: Auto Hotfix Post Bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-meta]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && needs.release-meta.outputs.reason == 'existing-tag' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next post-release version
        id: nextver
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="${{ needs.release-meta.outputs.version }}"
          TODAY_UTC=$(date -u +%Y%m%d)

          if [[ "${CURRENT_VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\.post([0-9]+))?$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "Unsupported version format for auto post bump: ${CURRENT_VERSION}" >&2
            exit 1
          fi

          # Use date-based post releases: x.y.z.postYYYYMMDDNN (NN starts from 01 each day).
          DAY_MAX_SEQ=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}.post${TODAY_UTC}*" \
            | awk -F'refs/tags/v' '{print $2}' \
            | awk -F'.post' '{print $2}' \
            | awk -v d="${TODAY_UTC}" 'BEGIN{m=0} $1 ~ "^" d "[0-9][0-9]$" {s=substr($1, length(d)+1, 2)+0; if (s>m) m=s} END{print m}')

          if [[ -z "${DAY_MAX_SEQ}" ]]; then
            DAY_MAX_SEQ=0
          fi

          if [[ "${CURRENT_VERSION}" =~ ^${BASE_VERSION}\.post(${TODAY_UTC})([0-9]{2})$ ]]; then
            CURRENT_SEQ="${BASH_REMATCH[2]}"
            CURRENT_SEQ=$((10#${CURRENT_SEQ}))
            if (( CURRENT_SEQ > DAY_MAX_SEQ )); then
              DAY_MAX_SEQ=${CURRENT_SEQ}
            fi
          fi

          NEXT_SEQ=$((DAY_MAX_SEQ + 1))
          if (( NEXT_SEQ > 99 )); then
            echo "Too many hotfix releases for ${TODAY_UTC} (max 99)." >&2
            exit 1
          fi

          NEXT_VERSION="${BASE_VERSION}.post${TODAY_UTC}$(printf '%02d' "${NEXT_SEQ}")"

          echo "next_version=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Computed hotfix version: ${NEXT_VERSION}"

      - name: Bump version files and push
        shell: bash
        run: |
          set -euo pipefail

          NEXT_VERSION="${{ steps.nextver.outputs.next_version }}"

          python - <<'PY'
          from pathlib import Path
          import re

          next_version = "${{ steps.nextver.outputs.next_version }}"

          init_path = Path("src/novel_downloader/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text, n1 = re.subn(
              r'(__version__\s*=\s*")([^"]+)(")',
              rf'\g<1>{next_version}\g<3>',
              init_text,
              count=1,
          )
          if n1 != 1:
              raise SystemExit("Failed to update __version__ in src/novel_downloader/__init__.py")
          init_path.write_text(init_text, encoding="utf-8")

          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          pyproject_text, n2 = re.subn(
              r'(?m)^(version\s*=\s*")([^"]+)(")',
              rf'\g<1>{next_version}\g<3>',
              pyproject_text,
              count=1,
          )
          if n2 != 1:
              raise SystemExit("Failed to update [tool.commitizen].version in pyproject.toml")
          pyproject_path.write_text(pyproject_text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/novel_downloader/__init__.py pyproject.toml
          git commit -m "chore(release): hotfix bump version to $NEXT_VERSION"
          git push origin HEAD:main

  publish:
    name: Build, Tag and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    needs: [release-meta]
    if: ${{ needs.release-meta.outputs.should_release == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release version consistency
        shell: bash
        run: |
          set -euo pipefail

          FILE_VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("src/novel_downloader/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("Unable to parse __version__ from src/novel_downloader/__init__.py")
          print(m.group(1))
          PY
          )

          if [[ "${FILE_VERSION}" != "${{ needs.release-meta.outputs.version }}" ]]; then
            echo "Version mismatch: expected ${{ needs.release-meta.outputs.version }}, got ${FILE_VERSION}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -U build twine setuptools wheel babel

      - name: Compile translations
        run: |
          pybabel compile -d src/novel_downloader/locales

      - name: Build package
        run: |
          python -m build

      - name: Prepare date-based release metadata
        id: rmeta
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DATE=$(date -u +%Y-%m-%d)
          RELEASE_STAMP=$(date -u +%Y%m%d)
          TAG="${{ needs.release-meta.outputs.tag }}"
          ARCHIVE_NAME="${TAG}-${RELEASE_STAMP}-dist.tar.gz"

          tar -czf "${ARCHIVE_NAME}" dist

          echo "release_date=${RELEASE_DATE}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.release-meta.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish to PyPI (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          user: __token__
          password: ${{ env.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

      - name: Fail when PyPI token is missing
        if: env.PYPI_API_TOKEN == ''
        shell: bash
        run: |
          echo "Missing PyPI token. Set repository or environment secret PYPI_API_TOKEN (or PYPI_TOKEN)." >&2
          echo "Trusted Publisher fallback is disabled to avoid invalid-publisher failures." >&2
          exit 1

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: ${{ needs.release-meta.outputs.tag }} (${{ steps.rmeta.outputs.release_date }})
          generate_release_notes: true
          files: |
            dist/*
            ${{ steps.rmeta.outputs.archive_name }}
