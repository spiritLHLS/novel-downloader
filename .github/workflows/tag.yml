name: Tag After Bump

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - src/novel_downloader/__init__.py

permissions:
  contents: write

jobs:
  tag:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): bump version to') }}"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from source file
        id: extract
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("src/novel_downloader/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("Unable to parse __version__ from src/novel_downloader/__init__.py")
          print(m.group(1))
          PY
          )
          if [[ -z "$VERSION" ]]; then
            echo "Version extraction failed" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${{ steps.extract.outputs.version }}"

          # Remove existing tag locally & remotely (if exists)
          git tag -d "$TAG" 2>/dev/null || true
          git push origin :refs/tags/$TAG 2>/dev/null || true

          # Create new tag
          git tag "$TAG"
          git push origin "$TAG"
